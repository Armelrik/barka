services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: barka
      POSTGRES_USER: barka
      POSTGRES_PASSWORD: barka_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barka -d barka"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
